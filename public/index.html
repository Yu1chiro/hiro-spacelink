<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Masuk — Hiro Space Link</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script>
/* Hiro Space Link — shared UI · monochrome (shadcn × Sankou) */
tailwind.config = { theme: { extend: { fontFamily: { sans: ['Inter', 'Noto Sans JP', 'ui-sans-serif', 'system-ui', 'sans-serif'] } } } };

(function injectStyle() {
  const s = document.createElement('style');
  s.textContent = `
  html{scroll-behavior:smooth}
  body{font-family:Inter,'Noto Sans JP',system-ui,sans-serif;color:#18181b;background:#fafafa;min-height:100vh;font-size:14px;letter-spacing:-.005em;-webkit-font-smoothing:antialiased}
  :focus-visible{outline:2px solid #18181b;outline-offset:2px}
  .no-scrollbar::-webkit-scrollbar{display:none}.no-scrollbar{scrollbar-width:none}
  @keyframes pop{from{opacity:0;transform:translateY(8px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  @keyframes shake{10%,90%{transform:translateX(-2px)}20%,80%{transform:translateX(4px)}30%,50%,70%{transform:translateX(-6px)}40%,60%{transform:translateX(6px)}}
  @keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
  .modal-pop{animation:pop .18s ease-out}.fade-in{animation:fade .18s ease-out}.shake{animation:shake .45s}.toast-in{animation:slidein .2s ease-out}
  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
  .ql-toolbar.ql-snow{border-color:#e4e4e7!important;background:#fafafa;border-radius:.375rem .375rem 0 0;padding:8px 10px}
  .ql-container.ql-snow{border-color:#e4e4e7!important;border-radius:0 0 .375rem .375rem;background:#fff;font-family:Inter,'Noto Sans JP',sans-serif;font-size:14px}
  .ql-editor{min-height:130px;max-height:220px;overflow-y:auto}
  .ql-editor.ql-blank::before{color:#a1a1aa;font-style:normal}
  .ql-snow .ql-stroke{stroke:#52525b}.ql-snow .ql-fill{fill:#52525b}
  .ql-snow.ql-toolbar button:hover .ql-stroke,.ql-snow.ql-toolbar button.ql-active .ql-stroke{stroke:#18181b}
  .cred h1{font-size:1.15rem;font-weight:600}.cred h2{font-size:1.05rem;font-weight:600}.cred h3{font-weight:600}
  .cred ul{list-style:disc;padding-left:1.25rem}.cred ol{list-style:decimal;padding-left:1.25rem}
  .cred a{color:#18181b;text-decoration:underline}.cred p{margin:.25rem 0;word-break:break-word}
  `;
  document.head.appendChild(s);
})();

/* ---------- Utils ---------- */
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const $ = (sel, root = document) => root.querySelector(sel);

async function api(url, opt = {}) {
  const o = { method: opt.method || 'GET', credentials: 'same-origin', headers: { 'X-Requested-With': 'XMLHttpRequest' } };
  if (opt.body !== undefined) { o.headers['Content-Type'] = 'application/json'; o.body = JSON.stringify(opt.body); }
  let res;
  try { res = await fetch(url, o); } catch { throw new Error('Tidak dapat terhubung ke server'); }
  let data = {};
  try { data = await res.json(); } catch { /* empty */ }
  if (res.status === 401 && location.pathname !== '/') { location.href = '/'; throw new Error('Sesi berakhir'); }
  if (!res.ok) throw new Error(data.error || 'Terjadi kesalahan');
  return data;
}

async function copyText(text) {
  try { await navigator.clipboard.writeText(text); }
  catch {
    const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0';
    document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove();
  }
}

/* ---------- Toast ---------- */
function toast(message, type = 'success') {
  let box = $('#toasts');
  if (!box) {
    box = document.createElement('div'); box.id = 'toasts';
    box.className = 'fixed z-[100] top-3 inset-x-3 sm:inset-x-auto sm:right-5 sm:top-5 sm:w-96 flex flex-col gap-2 pointer-events-none';
    document.body.appendChild(box);
  }
  const t = {
    success: ['fa-circle-check', 'bg-zinc-900 text-white border border-zinc-900'],
    error: ['fa-circle-exclamation', 'bg-white text-zinc-900 border border-zinc-900'],
    info: ['fa-circle-info', 'bg-zinc-100 text-zinc-900 border border-zinc-200']
  }[type] || ['fa-circle-info', 'bg-zinc-100 text-zinc-900 border border-zinc-200'];
  const el = document.createElement('div');
  el.className = `toast-in pointer-events-auto flex items-start gap-3 rounded-lg px-4 py-3 shadow-lg ${t[1]}`;
  el.innerHTML = `<i class="fa-solid ${t[0]} mt-0.5"></i><p class="flex-1 text-sm font-medium leading-snug">${esc(message)}</p>
    <button class="opacity-70 hover:opacity-100" aria-label="Tutup"><i class="fa-solid fa-xmark"></i></button>`;
  const close = () => { el.style.transition = 'opacity .2s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 200); };
  el.querySelector('button').onclick = close;
  box.appendChild(el);
  setTimeout(close, 3800);
}

</script>
</head>
<body class="overflow-x-hidden">
  <main class="min-h-screen flex items-center justify-center px-4 py-10">
    <div class="w-full max-w-sm bg-white border border-zinc-200 rounded-xl shadow-sm p-7 sm:p-9 modal-pop">
      <div class="space-y-5">
        <div class="w-11 h-11 rounded-md bg-zinc-900 text-white flex items-center justify-center text-lg"><i class="fa-solid fa-link"></i></div>
        <div class="space-y-1.5">
          <h1 class="text-2xl font-semibold tracking-tight text-zinc-900">Hiro Space Link</h1>
          <p class="text-zinc-500 text-sm leading-relaxed">Masukkan PIN 6 digit untuk membuka perpustakaan link pribadimu.</p>
        </div>
      </div>

      <div id="pin-box" class="mt-8 flex gap-2 sm:gap-2.5">
        <input class="pin w-11 h-14 sm:w-12 sm:h-14 text-center text-xl font-semibold rounded-md border border-zinc-200 bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 1">
        <input class="pin w-11 h-14 sm:w-12 sm:h-14 text-center text-xl font-semibold rounded-md border border-zinc-200 bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 2">
        <input class="pin w-11 h-14 sm:w-12 sm:h-14 text-center text-xl font-semibold rounded-md border border-zinc-200 bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 3">
        <input class="pin w-11 h-14 sm:w-12 sm:h-14 text-center text-xl font-semibold rounded-md border border-zinc-200 bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 4">
        <input class="pin w-11 h-14 sm:w-12 sm:h-14 text-center text-xl font-semibold rounded-md border border-zinc-200 bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 5">
        <input class="pin w-11 h-14 sm:w-12 sm:h-14 text-center text-xl font-semibold rounded-md border border-zinc-200 bg-white text-zinc-900 focus:outline-none focus:border-zinc-900 focus:ring-2 focus:ring-zinc-900/10 transition" type="password" inputmode="numeric" maxlength="1" autocomplete="off" aria-label="Digit 6">
      </div>

      <button id="login-btn" class="mt-6 w-full inline-flex items-center justify-center gap-2 py-2.5 rounded-md bg-zinc-900 text-white text-sm font-medium hover:bg-zinc-700 transition focus:outline-none focus-visible:ring-2 focus-visible:ring-zinc-900 focus-visible:ring-offset-2 active:scale-[.98] disabled:opacity-40 disabled:cursor-not-allowed" disabled>
        <i class="fa-solid fa-right-to-bracket"></i><span>Masuk</span>
      </button>
      <p class="mt-6 text-xs text-zinc-500"><i class="fa-solid fa-shield-halved mr-1.5"></i>Akses pribadi · sesi aman 12 jam</p>
    </div>
  </main>

  <script>
    const inputs = [...document.querySelectorAll('.pin')];
    const btn = document.getElementById('login-btn');
    const box = document.getElementById('pin-box');
    let busy = false;

    const value = () => inputs.map((i) => i.value).join('');
    const sync = () => { btn.disabled = busy || value().length !== 6; };

    inputs.forEach((inp, i) => {
      inp.addEventListener('input', () => {
        inp.value = inp.value.replace(/\D/g, '').slice(-1);
        if (inp.value && i < 5) inputs[i + 1].focus();
        sync();
        if (value().length === 6) submit();
      });
      inp.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !inp.value && i > 0) { inputs[i - 1].value = ''; inputs[i - 1].focus(); sync(); }
        if (e.key === 'ArrowLeft' && i > 0) inputs[i - 1].focus();
        if (e.key === 'ArrowRight' && i < 5) inputs[i + 1].focus();
        if (e.key === 'Enter') submit();
      });
      inp.addEventListener('focus', () => inp.select());
      inp.addEventListener('paste', (e) => {
        e.preventDefault();
        const d = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6);
        d.split('').forEach((ch, k) => { inputs[k].value = ch; });
        inputs[Math.min(d.length, 5)].focus(); sync();
        if (d.length === 6) submit();
      });
    });

    btn.addEventListener('click', submit);

    async function submit() {
      const pin = value();
      if (busy || pin.length !== 6) return;
      busy = true; btn.disabled = true;
      btn.querySelector('span').textContent = 'Memeriksa...';
      btn.querySelector('i').className = 'fa-solid fa-spinner fa-spin';
      try {
        await api('/api/auth/login', { method: 'POST', body: { pin } });
        toast('Selamat datang kembali 🌿');
        setTimeout(() => (location.href = '/dashboard'), 500);
      } catch (e) {
        toast(e.message, 'error');
        box.classList.remove('shake'); void box.offsetWidth; box.classList.add('shake');
        inputs.forEach((i) => (i.value = ''));
        inputs[0].focus();
        busy = false; sync();
        btn.querySelector('span').textContent = 'Masuk';
        btn.querySelector('i').className = 'fa-solid fa-right-to-bracket';
      }
    }
    inputs[0].focus();
  </script>
</body>
</html>
